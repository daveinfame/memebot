
<!doctype html>
<html lang="es">
  <head>
    <script type="module">import { injectIntoGlobalHook } from "/@react-refresh";
injectIntoGlobalHook(window);
window.$RefreshReg$ = () => {};
window.$RefreshSig$ = () => (type) => type;</script>

    <script type="module" src="/@vite/client"></script>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memebot · bot de copy trading (terminal)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=VT323&family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <style>
      html, body { margin: 0; min-height: 100%; background: #000000; color: #d6ffe0; }
      #boot-splash {
        position: fixed; inset: 0; z-index: 9999; background: #000000;
        display: flex; align-items: center; justify-content: center;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        transition: opacity .5s ease;
      }
      #boot-splash.gone { opacity: 0; pointer-events: none; }
      .boot-box { max-width: 560px; width: 92%; text-align: center; padding: 24px; }
      .boot-pre {
        color: #00ff41; font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 20px; letter-spacing: .12em; white-space: pre;
        text-shadow: 0 0 22px rgba(0,255,65,.5); margin: 0 0 20px;
      }
      .boot-bar { width: 230px; height: 6px; margin: 0 auto 16px; border: 1px solid #0e3a1f; border-radius: 4px; overflow: hidden; background: #03110a; }
      .boot-bar i { display: block; height: 100%; width: 38%; background: #00ff41; border-radius: 3px; animation: boot-slide 1.1s ease-in-out infinite; }
      @keyframes boot-slide { 0% { transform: translateX(-120%);} 100% { transform: translateX(300%);} }
      .boot-msg { color: #79b58f; font-size: 12px; letter-spacing: .14em; margin: 0; }
      .boot-err {
        display: none; margin-top: 20px; padding: 14px 16px; border: 1px solid rgba(255,64,64,.55);
        border-radius: 10px; background: rgba(255,64,64,.07); color: #ffb3b3;
        font-size: 12px; line-height: 1.7; text-align: left; white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <div id="boot-splash">
      <div class="boot-box">
        <pre class="boot-pre">▚ MEMEBOT v3.2</pre>
        <div class="boot-bar"><i></i></div>
        <p class="boot-msg" id="boot-msg">ARRANCANDO EL BOT…</p>
        <div class="boot-err" id="boot-err"></div>
      </div>
    </div>

    <script>
      (function () {
        var fails = [];
        var NOISE = /websocket|socket|hmr|vite|network|fetch|load failed|timeout|abort/i;
        function showErr(msg) {
          var box = document.getElementById("boot-err");
          var p = document.getElementById("boot-msg");
          if (box) { box.style.display = "block"; box.textContent = msg; }
          if (p) p.textContent = "EL BOT NO PUDO ARRANCAR";
        }
        window.__hideBoot = function () {
          /* arranque exitoso → limpiar el contador de reintentos */
          try { sessionStorage.removeItem("__bootTries"); } catch (e) {}
          var s = document.getElementById("boot-splash");
          if (s) { s.classList.add("gone"); setTimeout(function () { s.remove(); }, 650); }
        };
        /* captura en fase de captura para atrapar fallos de módulos/recursos */
        window.addEventListener("error", function (e) {
          if (e.message && NOISE.test(e.message)) return;
          var stack = e.error && e.error.stack ? "\n" + String(e.error.stack).split("\n").slice(0, 3).join("\n") : "";
          fails.push((e.filename ? e.filename.split("/").pop() + ":" + e.lineno + " → " : "") + (e.message || "error de script") + stack);
        }, true);
        window.addEventListener("unhandledrejection", function (e) {
          var msg = e.reason && e.reason.message ? e.reason.message : String(e.reason);
          if (NOISE.test(msg)) { e.preventDefault(); return; }
          fails.push("promesa: " + msg);
        });
        var poll = setInterval(function () {
          var root = document.getElementById("root");
          if (root && root.childElementCount > 0) { clearInterval(poll); window.__hideBoot(); }
        }, 350);
        setTimeout(function () { clearInterval(poll); }, 8000);
        setTimeout(function () {
          var root = document.getElementById("root");
          if ((root && root.childElementCount > 0) || window.__booted) { window.__hideBoot(); return; }
          var tries = 0;
          try { tries = parseInt(sessionStorage.getItem("__bootTries") || "0", 10) || 0; } catch (e) { tries = 99; }
          if (tries < 1 && !window.__bootScriptFailed) {
            try { sessionStorage.setItem("__bootTries", "1"); } catch (e) {}
            var p = document.getElementById("boot-msg");
            if (p) p.textContent = "CACHÉ VIEJA DETECTADA · RECARGANDO…";
            setTimeout(function () {
              var sep = location.search ? "&" : "?";
              location.href = location.href.split("#")[0] + sep + "retry=" + Date.now();
            }, 900);
            return;
          }
          var stage = window.__bootScriptFailed
            ? "No se descargó el script principal (revisa tu conexión o la Vista previa)."
            : window.__mainReached
              ? "El bot empezó a ejecutarse pero se estrelló al dibujar la interfaz."
              : "El script se descargó pero un módulo falló al cargar (suele ser caché vieja).";
          var detail = fails.length ? fails.slice(-4).join("\n") + "\n\n" : "";
          showErr("DIAGNÓSTICO: " + stage + "\n\n" + detail +
            "1) Presiona Ctrl + F5 (recarga forzada)\n" +
            "2) O usa el botón Actualizar de la pestaña Vista previa\n" +
            "3) Si persiste, copia TODO este texto y pégamelo en el chat");
        }, 9000);
      })();
    </script>

    <script
      type="module"
      src="/src/main.tsx?t=1788152212714"
      onerror="window.__bootScriptFailed=true; var p=document.getElementById('boot-msg'); if(p){p.textContent='NO SE DESCARGÓ EL SCRIPT DEL BOT';} var b=document.getElementById('boot-err'); if(b){b.style.display='block'; b.textContent='El archivo principal no se pudo descargar.\n1) Presiona Ctrl + F5\n2) O el botón Actualizar de la Vista previa';}"
    ></script>
  </body>
</html>
